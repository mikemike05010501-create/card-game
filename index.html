<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POKER ARENA - 奢華黑金 VIP 賭城</title>
  <!-- PWA 手遊全螢幕設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; }
    
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 15px rgba(212,175,55,0.4); }
      50% { box-shadow: 0 0 28px rgba(212,175,55,0.85); }
      100% { box-shadow: 0 0 15px rgba(212,175,55,0.4); }
    }
    @keyframes breathe {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.015); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes gold-shine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at center, #113426 0%, #081611 60%, #030605 100%);
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 賭桌綠呢底紋與暗邊 */
    body::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
      pointer-events: none; z-index: 1;
    }

    /* 1. 頂部 HUD */
    .hud-bar {
      height: 60px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%);
      z-index: 10; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .player-profile {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0, 0, 0, 0.6); padding: 4px 14px 4px 6px;
      border-radius: 30px; border: 1px solid #d4af37;
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid #d4af37;
      background: url('https://api.dicebear.com/7.x/adventurer/svg?seed=kato') no-repeat center/cover, #fff;
    }
    .player-name { font-weight: bold; color: #fff; font-size: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .player-trophy { font-size: 11px; color: #f1c40f; display: flex; align-items: center; gap: 4px; }

    .currencies { display: flex; gap: 12px; }
    .currency-chip {
      background: rgba(0,0,0,0.65); border: 1.5px solid rgba(212,175,55,0.4);
      padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; gap: 6px; min-width: 90px;
    }
    .currency-chip.gems { color: #2ecc71; border-color: rgba(46,204,113,0.5); }
    .currency-chip.coins { color: #f1c40f; border-color: rgba(241,196,15,0.5); }
    .currency-chip.stars { color: #9b59b6; border-color: rgba(155,89,182,0.5); }

    /* 2. 左側邊欄（功能按鈕） */
    .left-menu {
      position: absolute; left: 20px; top: 85px; display: flex; flex-direction: column; gap: 14px; z-index: 5;
    }
    .menu-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: radial-gradient(circle, #2d3436 0%, #1a1a1a 100%);
      border: 2px solid #d4af37; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5); position: relative;
    }
    .menu-btn:active { transform: scale(0.9); }
    .menu-btn span { font-size: 20px; margin-bottom: -2px; }
    .menu-btn label { font-size: 10px; font-weight: bold; color: #f1c40f; }
    .menu-badge {
      position: absolute; top: -2px; right: -2px; background: #e74c3c; color: white;
      font-size: 9px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #fff;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }

    /* 3. 中央 Croupier（魔術荷官） */
    .center-visual {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 460px; height: 82vh; pointer-events: none; z-index: 2;
      animation: breathe 5s ease-in-out infinite; background-size: contain; background-repeat: no-repeat; background-position: bottom center;
    }
    /* 為避免載入過慢，預設使用高度擬真的插畫圖示 */
    .croupier-illustration {
      width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    }
    .dealer-suit {
      font-size: 160px; line-height: 1; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8)); text-align: center;
    }

    /* 4. 下方與右側社交按鈕 */
    .right-menu {
      position: absolute; right: 20px; top: 85px; display: flex; flex-direction: column; gap: 14px; z-index: 5;
    }
    .side-tag-btn {
      width: 75px; height: 50px; background: linear-gradient(135deg, #1e272e, #2f3640);
      border: 1px solid rgba(212,175,55,0.4); border-radius: 8px; font-size: 12px; font-weight: bold;
      color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .side-tag-btn span { font-size: 18px; }

    /* 通行證 */
    .pass-container {
      position: absolute; left: 20px; bottom: 20px; z-index: 5;
      background: linear-gradient(90deg, #1e272e 0%, rgba(47, 54, 64, 0.95) 100%);
      border: 1px solid #d4af37; border-radius: 10px; width: 280px; height: 62px;
      display: flex; align-items: center; padding: 0 12px; gap: 10px;
    }
    .pass-badge { font-size: 26px; }
    .pass-progress { flex: 1; }
    .pass-bar { height: 10px; background: #000; border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .pass-fill { width: 35%; height: 100%; background: linear-gradient(90deg, #f39c12, #f1c40f); }

    /* 5. 巨大黃金對戰按鈕 */
    .battle-center {
      position: absolute; right: 20px; bottom: 20px; z-index: 6; display: flex; flex-direction: column; gap: 10px;
    }
    .battle-mode-bar {
      width: 250px; background: rgba(0,0,0,0.7); border: 1px solid rgba(212,175,55,0.3);
      padding: 6px 12px; border-radius: 8px; text-align: center; color: #e1b12c; font-size: 11px; font-weight: bold;
    }
    .battle-mode-bar span { font-size: 14px; color: #fff; display: block; margin-bottom: 2px; }

    .play-btn {
      width: 250px; height: 75px; background: linear-gradient(135deg, #f1c40f, #d4af37, #9a7d0a);
      border: 2px solid #fff; border-radius: 12px; color: #1e272e; font-size: 26px; font-weight: 900;
      letter-spacing: 2px; text-shadow: 0 1px 2px rgba(255,255,255,0.8); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(212,175,55,0.5); transition: 0.2s; position: relative;
      overflow: hidden; animation: pulse-glow 2s infinite;
    }
    .play-btn::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-25deg); animation: gold-shine 3.5s ease-in-out infinite;
    }
    .play-btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(212,175,55,0.3); }
    .play-btn label { font-size: 11px; font-weight: bold; opacity: 0.85; margin-top: 1px; color: #000; }

    /* 6. 彈窗與牌桌 (Modals) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
      align-items: center; z-index: 100;
    }
    .modal-box {
      background: radial-gradient(circle at center, #1c2620 0%, #0d120f 100%);
      border-radius: 14px; padding: 25px; width: 440px; text-align: center;
      border: 2.5px solid #d4af37; box-shadow: 0 0 30px rgba(212,175,55,0.3);
    }
    .modal-title { color: #f1c40f; font-size: 22px; margin-bottom: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    .list-item {
      background: rgba(255,255,255,0.06); margin: 8px 0; padding: 10px 14px;
      border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; border-left: 3px solid #d4af37;
    }
    .list-item button {
      background: #f1c40f; color: #000; border: none; border-radius: 4px;
      padding: 3px 10px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .list-item button:disabled { background: #555; color: #888; }

    .game-match-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #133a27 0%, #050d09 100%);
      z-index: 120; display: flex; flex-direction: column; justify-content: space-between; padding: 40px;
    }
    .poker-felt-grid {
      border: 2px dashed rgba(212,175,55,0.35); border-radius: 12px; flex: 1; margin: 20px 0;
      display: flex; flex-direction: column; justify-content: space-around; position: relative;
    }
    .deck-action-btn {
      width: 150px; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold;
      background: #f1c40f; border: none; color:#000; cursor:pointer; margin: 0 auto;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="theme-casino-main">

  <!-- 1. 頂部 HUD 資訊列 -->
  <div class="hud-bar">
    <div class="player-profile">
      <div class="avatar"></div>
      <div>
        <div class="player-name">kato</div>
        <div class="player-trophy">🏆 1,200 <span>等級 15</span></div>
      </div>
    </div>
    
    <div class="currencies">
      <div class="currency-chip stars">💜 999</div>
      <div id="coinCount" class="currency-chip coins">🪙 23,189</div>
      <div class="currency-chip gems">💚 1,000,000</div>
    </div>
  </div>

  <!-- 2. 左側系統按鈕 -->
  <div class="left-menu">
    <div class="menu-btn" onclick="alert('商店: 卡牌皮膚、專屬特權籌碼上架中！')">
      <span>🛒</span>
      <label>商店</label>
    </div>
    <div class="menu-btn" onclick="alert('角色: 賭神 KATO 已就緒，技能「透視、幸運值 +20%」')">
      <span>🎴</span>
      <label>角色</label>
    </div>
    <div class="menu-btn" onclick="alert('最新公告：1v1 賭神巡迴賽已正式開跑！')">
      <span>📰</span>
      <div class="menu-badge">!</div>
      <label>新聞</label>
    </div>
  </div>

  <!-- 3. 左下角「賭金通行證」 -->
  <div class="pass-container" onclick="alert('VIP 通行證: 再獲得 350 積分即可領取黃金寶箱！')">
    <div class="pass-badge">🎫</div>
    <div class="pass-progress">
      <div style="font-size: 11px; margin-bottom: 2px; color: #f1c40f; font-weight: bold;">賭金通行證 (VIP Pass)</div>
      <div class="pass-bar"><div class="pass-fill"></div></div>
    </div>
    <div style="font-size: 10px; color: #999;">0 / 500</div>
    <div style="font-size: 20px;">🎁</div>
  </div>

  <!-- 4. 中央 Croupier 洗牌魔術師荷官 -->
  <div class="center-visual">
    <div class="croupier-illustration">
      <div class="dealer-suit" style="position:relative; top:20px;">🎩</div>
      <div class="dealer-suit" style="font-size: 130px; margin-top:-70px;">🤵</div>
      <div style="color: #f1c40f; text-shadow: 0 2px 5px rgba(0,0,0,0.5); font-weight: bold; font-size: 24px; position:absolute; bottom:140px;">🃏 POKER ARENA 🃏</div>
    </div>
  </div>

  <!-- 5. 右側社交功能 -->
  <div class="right-menu">
    <button class="side-tag-btn" onclick="alert('在線好友：3/54 人')"><span>👥</span>好友</button>
    <button class="side-tag-btn" onclick="alert('小隊：未加入小隊')"><span>🏠</span>小隊</button>
    <button class="side-tag-btn" onclick="alert('目前尚未加入任何戰隊')"><span>🏅</span>戰隊</button>
  </div>

  <!-- 任務與每日禮物（左下上方） -->
  <div style="position: absolute; left: 110px; bottom: 20px; display: flex; gap: 10px; z-index: 5;">
    <button onclick="openTasks()" style="background: rgba(0,0,0,0.6); border: 1.5px solid #d4af37; border-radius: 8px; color: #fff; padding: 6px 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">📋 每日任務</button>
    <button id="giftBtn" onclick="claimDailyGift()" style="background: rgba(0,0,0,0.6); border: 1.5px solid #d4af37; border-radius: 8px; color: #fff; padding: 6px 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">🎁 每日禮物</button>
  </div>

  <!-- 6. 右下角對戰開始區域 -->
  <div class="battle-center">
    <div class="battle-mode-bar">
      <span>經典快速對決</span>
      🏆 1v1 賭神賽
    </div>
    <button id="matchBtn" class="play-btn">
      對戰
      <label>真人即時配對 (Match)</label>
    </button>
  </div>

  <!-- 【彈窗：任務中心】 -->
  <div id="tasksModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 class="modal-title">📋 今日每日任務</h2>
      <div id="taskItem1" class="list-item">
        <span>🎮 在 1v1 經典賽獲得 1 次勝利</span>
        <button onclick="completeTask('taskItem1', 500)">領取 500 🪙</button>
      </div>
      <div id="taskItem2" class="list-item">
        <span>🎰 累計下注滿 5,000 籌碼</span>
        <button onclick="completeTask('taskItem2', 300)">領取 300 🪙</button>
      </div>
      <div id="taskItem3" class="list-item">
        <span>🃏 參與一次真人即時對戰</span>
        <button id="quickBattleBtn" disabled>未達成</button>
      </div>
      <button onclick="closeModal('tasksModal')" style="margin-top: 15px; background: transparent; border: 1.5px solid #d4af37; color: #d4af37; padding: 6px 16px; border-radius: 6px; cursor: pointer;">關閉</button>
    </div>
  </div>

  <!-- 【彈窗：排隊配對中】 -->
  <div id="matchingModal" class="modal-overlay hidden">
    <div class="modal-box" style="width: 360px;">
      <h2 style="color:#f1c40f;">搜尋對手中...</h2>
      <div style="font-size: 50px; margin: 20px 0; animation: breathe 1.5s infinite;">⏳</div>
      <p id="matchStatus" style="color: #ccc; font-size: 14px;">正在全網搜尋線上牌手...</p>
      <button id="cancelBtn" onclick="cancelMatch()" style="margin-top: 20px; background: #e74c3c; border: none; color: white; padding: 8px 20px; border-radius: 6px; cursor: pointer;">取消配對</button>
    </div>
  </div>

  <!-- 【戰鬥牌桌視圖】 -->
  <div id="gameMatchView" class="game-match-view hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="roomTitle" style="color: #f1c40f;">🏆 賭神賽 room_xxxx</h2>
      <div style="font-size: 14px; color: #ccc;">賭池: 10,000 🪙</div>
    </div>

    <!-- 牌桌 -->
    <div class="poker-felt-grid">
      <!-- 對手 -->
      <div style="text-align: center;">
        <div style="color: #ea8685;">對手 (Opponent)</div>
        <div id="opponentCards" style="font-size: 28px; letter-spacing: 4px; margin-top: 8px;">🂠 🂠 (2 張)</div>
      </div>

      <!-- 戰場提示 -->
      <div id="boardTips" style="text-align: center; font-size: 14px; color: #f1c40f;"></div>

      <!-- 我方 -->
      <div style="text-align: center;">
        <div style="color: #2ecc71;">你的手牌 (Kato)</div>
        <div id="myCards" style="font-size: 30px; letter-spacing: 3px; font-weight: bold; margin-top: 8px; color: #fff;">-</div>
      </div>
    </div>

    <div style="display: flex; gap: 20px; justify-content: center;">
      <button id="drawBtn" class="deck-action-btn">抽一張牌</button>
      <button onclick="leaveGame()" style="background: transparent; border: 1.5px solid #e74c3c; color: #e74c3c; font-size: 16px; padding: 12px 24px; border-radius: 8px; cursor: pointer;">認輸 / 離開</button>
    </div>
  </div>

  <script>
    // 串接 Render 伺服器
    const SERVER_URL = "https://game-server-mike.onrender.com";
    const socket = io(SERVER_URL);

    let activeRoomId = null;
    let coins = 23189;

    function openTasks() { document.getElementById('tasksModal').classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // 每日禮物
    function claimDailyGift() {
      const btn = document.getElementById('giftBtn');
      if (btn.disabled) return;
      coins += 500;
      document.getElementById('coinCount').innerText = `🪙 ${coins.toLocaleString()}`;
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.innerText = "🎁 已領取";
      alert("領取每日禮物成功！獲得 500 金幣！");
    }

    // 完成任務
    function completeTask(taskId, reward) {
      const el = document.getElementById(taskId).querySelector('button');
      if (el.disabled) return;
      coins += reward;
      document.getElementById('coinCount').innerText = `🪙 ${coins.toLocaleString()}`;
      el.disabled = true;
      el.innerText = "已領取";
      alert(`領取任務獎勵 ${reward} 金幣！`);
    }

    // 按下對戰開始排隊
    const matchBtn = document.getElementById('matchBtn');
    matchBtn.addEventListener('click', () => {
      socket.emit('start_match');
      document.getElementById('matchingModal').classList.remove('hidden');
    });

    // 取消配對
    function cancelMatch() {
      // 模擬取消，並關閉 Modal
      document.getElementById('matchingModal').classList.add('hidden');
    }

    // 接收開局
    socket.on('game_start', (data) => {
      activeRoomId = data.roomId;
      
      // 隱藏配對彈窗
      document.getElementById('matchingModal').classList.add('hidden');
      
      // 切換至牌桌
      document.getElementById('gameMatchView').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = `🏆 賭神賽 (${activeRoomId})`;
      
      // 將「參與真人對局」任務設為可領取
      const task3 = document.getElementById('quickBattleBtn');
      task3.disabled = false;
      task3.innerText = "領取 400 🪙";
      task3.onclick = () => {
        coins += 400;
        document.getElementById('coinCount').innerText = `🪙 ${coins.toLocaleString()}`;
        task3.disabled = true;
        task3.innerText = "已領取";
      };

      renderBoard(data.players);
    });

    // 抽牌操作
    const drawBtn = document.getElementById('drawBtn');
    drawBtn.addEventListener('click', () => {
      socket.emit('draw_card', { roomId: activeRoomId });
    });

    // 更新牌局
    socket.on('update_board', (data) => {
      renderBoard(data.players);
    });

    function renderBoard(players) {
      const myId = socket.id;
      for (const id in players) {
        if (id === myId) {
          myCards.innerText = players[id].cards.join(' , ');
        } else {
          opponentCards.innerText = players[id].cards.map(() => '🂠').join(' ') + ` (${players[id].cards.length} 張)`;
        }
      }
    }

    function leaveGame() {
      if (confirm('確定要離開本次對局嗎？')) {
        document.getElementById('gameMatchView').classList.add('hidden');
        activeRoomId = null;
      }
    }
  </script>
</body>
</html>
