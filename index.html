<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POKER ARENA - VIP CASINO</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --gold-primary: linear-gradient(135deg, #fce072 0%, #dfb746 50%, #9e791e 100%);
      --gold-border: 1px solid rgba(245, 208, 97, 0.6);
      --glass-dark: rgba(14, 20, 16, 0.75);
      --shadow-luxury: 0 8px 24px rgba(0,0,0,0.75), inset 0 1px 1px rgba(255,255,255,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; }
    
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      /* 直接載入賭桌實景高解析雲端圖片 */
      background: #09130e url('https://images.unsplash.com/photo-1518609878373-06d740f60d8b?q=80&w=2000&auto=format&fit=crop') no-repeat center center / cover;
      color: #fff; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }

    /* 頂部 HUD */
    .hud-bar {
      height: 64px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 25px; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      z-index: 10; position: relative;
    }
    .player-profile {
      display: flex; align-items: center; gap: 10px;
      background: var(--glass-dark); padding: 5px 18px 5px 6px;
      border-radius: 40px; border: var(--gold-border); box-shadow: var(--shadow-luxury);
      cursor: pointer; backdrop-filter: blur(10px);
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid #e5c158;
      background: url('https://api.dicebear.com/7.x/adventurer/svg?seed=kato') no-repeat center/cover;
      box-shadow: 0 0 12px rgba(229,193,88,0.5);
    }
    .player-name { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
    .trophy-badge { font-size: 11px; color: #f5d061; display: flex; align-items: center; gap: 4px; }

    .currencies { display: flex; gap: 14px; }
    .currency-chip {
      background: var(--glass-dark); border: var(--gold-border);
      padding: 3px 14px 3px 6px; border-radius: 20px; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-luxury);
      font-family: 'Bebas Neue', sans-serif; backdrop-filter: blur(10px);
    }
    .currency-chip .icon {
      width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff;
    }
    .chip-purple .icon { background: #8e44ad; }
    .chip-gold .icon { background: linear-gradient(135deg, #f1c40f, #d35400); border: 1px solid #fff; }
    .chip-green .icon { background: #27ae60; }

    /* 左側選單 */
    .left-menu {
      position: absolute; left: 24px; top: 85px; display: flex; flex-direction: column; gap: 12px; z-index: 5;
    }
    .menu-btn {
      width: 62px; height: 62px; border-radius: 16px;
      background: linear-gradient(145deg, rgba(32,44,38,0.85) 0%, rgba(10,16,13,0.95) 100%);
      border: var(--gold-border); display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: var(--shadow-luxury); backdrop-filter: blur(8px);
    }
    .menu-btn:active { transform: scale(0.92); }
    .menu-btn span { font-size: 24px; }
    .menu-btn label { font-size: 10px; font-weight: 800; color: #f5d061; margin-top: 2px; }

    /* 右側選單 */
    .right-menu {
      position: absolute; right: 24px; top: 85px; display: flex; flex-direction: column; gap: 12px; z-index: 5;
    }
    .side-tag-btn {
      width: 72px; height: 52px;
      background: linear-gradient(145deg, rgba(32,44,38,0.85) 0%, rgba(10,16,13,0.95) 100%);
      border: var(--gold-border); border-radius: 12px; font-size: 11px; font-weight: bold;
      color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px; box-shadow: var(--shadow-luxury); backdrop-filter: blur(8px);
    }
    .side-tag-btn:active { transform: scale(0.92); }
    .side-tag-btn span { font-size: 20px; }

    /* 通行證 */
    .pass-container {
      position: absolute; left: 24px; bottom: 24px; z-index: 5;
      background: linear-gradient(90deg, rgba(14,20,16,0.92) 0%, rgba(22,34,27,0.88) 100%);
      border: var(--gold-border); border-radius: 16px; width: 290px; height: 68px;
      display: flex; align-items: center; padding: 0 16px; gap: 12px; box-shadow: var(--shadow-luxury);
      cursor: pointer; backdrop-filter: blur(10px);
    }
    .pass-badge { font-size: 30px; }
    .pass-progress { flex: 1; }
    .pass-bar { height: 10px; background: rgba(0,0,0,0.6); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-top: 4px; }
    .pass-fill { width: 45%; height: 100%; background: linear-gradient(90deg, #f39c12, #f1c40f); }

    /* 中央標題印記 */
    .center-logo {
      position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; z-index: 2;
    }
    .center-logo h1 {
      font-family: 'Cinzel', serif; font-size: 42px; font-weight: 900; letter-spacing: 8px;
      background: linear-gradient(180deg, #fff7d6 0%, #e2b94f 50%, #94721c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.9));
    }
    .center-logo p {
      font-size: 13px; letter-spacing: 4px; color: rgba(245, 208, 97, 0.85);
      font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,0.8); margin-top: 4px;
    }

    /* 右下角對戰按鈕 */
    .battle-center {
      position: absolute; right: 24px; bottom: 24px; z-index: 6; display: flex; flex-direction: column; gap: 8px;
    }
    .battle-mode-bar {
      width: 240px; background: var(--glass-dark); border: var(--gold-border);
      padding: 6px 12px; border-radius: 10px; text-align: center; color: #f5d061; font-size: 11px; font-weight: bold;
      box-shadow: var(--shadow-luxury); backdrop-filter: blur(8px);
    }
    .battle-mode-bar span { font-family: 'Cinzel', serif; font-size: 14px; color: #fff; display: block; margin-bottom: 2px; }

    .play-btn {
      width: 240px; height: 74px; background: var(--gold-primary);
      border: 2px solid #fff; border-radius: 16px; color: #1c1505; font-size: 28px; font-weight: 900;
      letter-spacing: 4px; font-family: 'Cinzel', serif; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(223, 183, 70, 0.55), inset 0 2px 4px #fff;
    }
    .play-btn:active { transform: scale(0.95); }
    .play-btn label { font-size: 11px; font-weight: 800; font-family: 'Outfit', sans-serif; letter-spacing: 1px; color: #2c1e02; }

    /* 彈窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; justify-content: center; align-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: 0.25s ease; backdrop-filter: blur(8px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: linear-gradient(180deg, rgba(24,34,28,0.96) 0%, rgba(10,16,13,0.98) 100%);
      border-radius: 20px; padding: 28px; width: 440px; text-align: center;
      border: 2px solid #dfb746; box-shadow: 0 0 40px rgba(223, 183, 70, 0.4);
    }
    .modal-title { font-family: 'Cinzel', serif; color: #f5d061; font-size: 24px; margin-bottom: 16px; }
    .login-input {
      width: 82%; padding: 12px 16px; font-size: 16px; font-weight: bold;
      border: 2px solid #dfb746; border-radius: 12px; background: rgba(0,0,0,0.7);
      color: #fff; text-align: center; outline: none; margin: 16px 0;
    }
    .btn-gold {
      background: var(--gold-primary); color: #1c1505; border: none;
      border-radius: 24px; padding: 10px 32px; font-size: 15px; font-weight: 800; cursor: pointer;
    }

    /* 對戰牌桌 */
    .game-match-view {
      position: fixed; inset: 0;
      background: #09130e url('https://images.unsplash.com/photo-1518609878373-06d740f60d8b?q=80&w=2000&auto=format&fit=crop') no-repeat center center / cover;
      z-index: 120; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 40px;
    }
    .battle-avatar-card {
      background: var(--glass-dark); border: var(--gold-border); padding: 8px 16px; border-radius: 14px;
      display: flex; align-items: center; gap: 10px; width: 220px; box-shadow: var(--shadow-luxury); backdrop-filter: blur(8px);
    }
    .hand-cards { display: flex; justify-content: center; gap: 14px; margin-top: 10px; min-height: 105px; }
    .poker-card {
      width: 72px; height: 102px; background: #fff; border-radius: 8px; border: 2px solid #000;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between;
      padding: 6px 8px; font-weight: bold; color: #1e272e;
    }
    .poker-card.red { color: #e74c3c; }
    .poker-card.back {
      background: linear-gradient(135deg, #c0392b, #962d22); border: 2.5px solid #fff;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 頂部 HUD -->
  <div class="hud-bar">
    <div class="player-profile" onclick="openLoginModal(true)" title="點擊修改暱稱">
      <div id="playerAvatar" class="avatar"></div>
      <div>
        <div id="playerNameText" class="player-name">VIP 牌手</div>
        <div class="trophy-badge">🏆 1,200 <span>鑽石席位</span></div>
      </div>
    </div>
    
    <div class="currencies">
      <div class="currency-chip chip-purple"><div class="icon">💜</div><span>999</span></div>
      <div id="coinCount" class="currency-chip chip-gold"><div class="icon">🪙</div><span>23,189</span></div>
      <div class="currency-chip chip-green"><div class="icon">💚</div><span>1,000,000</span></div>
    </div>
  </div>

  <!-- 左側選單 -->
  <div class="left-menu">
    <div class="menu-btn" onclick="alert('商店功能準備中！')"><span>🛒</span><label>商店</label></div>
    <div class="menu-btn" onclick="openLoginModal(true)"><span>🎴</span><label>改名</label></div>
    <div class="menu-btn" onclick="alert('賭城巡迴錦標賽開打中！')"><span>📰</span><label>新聞</label></div>
  </div>

  <!-- 中央品牌標題 -->
  <div class="center-logo">
    <h1>POKER ARENA</h1>
    <p>EXCLUSIVE HIGH-ROLLER TABLE</p>
  </div>

  <!-- 左下通行證 -->
  <div class="pass-container" onclick="alert('VIP 通行證：即將解鎖百萬賽池寶箱！')">
    <div class="pass-badge">🎫</div>
    <div class="pass-progress">
      <div style="font-size: 11px; font-weight: 800; color: #f5d061;">賭金通行證 (VIP PASS)</div>
      <div class="pass-bar"><div class="pass-fill"></div></div>
    </div>
    <div style="font-size: 22px;">🎁</div>
  </div>

  <!-- 右側選單 -->
  <div class="right-menu">
    <button class="side-tag-btn" onclick="alert('在線好友：3 人')"><span>👥</span>好友</button>
    <button class="side-tag-btn" onclick="alert('小隊功能即將開放')"><span>🏠</span>小隊</button>
    <button class="side-tag-btn" onclick="alert('戰隊排名本週第 5')"><span>🏅</span>戰隊</button>
  </div>

  <!-- 每日任務與禮物 -->
  <div style="position: absolute; left: 110px; bottom: 105px; display: flex; gap: 12px; z-index: 5;">
    <button onclick="alert('今日任務：在 1v1 對戰中獲勝 1 場 (0/1)')" style="background: var(--glass-dark); border: var(--gold-border); border-radius: 20px; color: #fff; padding: 7px 16px; font-weight: bold; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px);">📋 每日任務</button>
    <button onclick="alert('每日禮物已領取：獲得 500 金幣！')" style="background: var(--glass-dark); border: var(--gold-border); border-radius: 20px; color: #fff; padding: 7px 16px; font-weight: bold; font-size: 12px; cursor: pointer; backdrop-filter: blur(8px);">🎁 每日禮物</button>
  </div>

  <!-- 右下角對戰按鈕 -->
  <div class="battle-center">
    <div class="battle-mode-bar">
      <span>經典快速對決</span>
      🏆 1v1 賭神錦標賽
    </div>
    <button id="matchBtn" class="play-btn">
      對戰
      <label>MATCHING</label>
    </button>
  </div>

  <!-- 登入彈窗 -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="loginModalTitle" class="modal-title">牌手登入</h2>
      <p style="color: #bbb; font-size: 13px;">請輸入你的遊戲暱稱：</p>
      <input type="text" id="usernameInput" class="login-input" placeholder="輸入暱稱..." maxlength="12">
      <div>
        <button class="btn-gold" onclick="savePlayerName()">確定進入</button>
      </div>
    </div>
  </div>

  <!-- 配對中彈窗 -->
  <div id="matchingModal" class="modal-overlay">
    <div class="modal-box" style="width: 340px;">
      <h3 style="color:#f5d061; font-family:'Cinzel',serif; font-size: 20px;">尋找對手中...</h3>
      <div style="font-size: 45px; margin: 18px 0;">♣️♥️♦️♠️</div>
      <p style="color: #ccc; font-size: 13px;">正在為您安排席位...</p>
      <button onclick="document.getElementById('matchingModal').classList.remove('active')" style="margin-top:18px; background:#c0392b; color:#fff; border:none; padding:8px 22px; border-radius:20px; font-weight:bold; cursor:pointer;">取消配對</button>
    </div>
  </div>

  <!-- 對戰牌桌 -->
  <div id="gameMatchView" class="game-match-view hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="battle-avatar-card">
        <div id="battleMyAvatar" class="avatar" style="width:36px; height:36px;"></div>
        <div>
          <div id="battleMyName" style="font-weight: 800; font-size: 14px;">我方</div>
          <div style="color:#4cd137; font-size:11px;">你的手牌</div>
        </div>
      </div>
      <h2 id="roomTitle" style="color: #f5d061; font-family:'Cinzel', serif; font-size: 20px;">🏆 賭神錦標賽</h2>
      <div class="battle-avatar-card" style="flex-direction: row-reverse; text-align: right; border-color: rgba(231,76,60,0.6);">
        <div id="battleOppAvatar" class="avatar" style="width:36px; height:36px;"></div>
        <div>
          <div id="battleOppName" style="font-weight: 800; font-size: 14px; color:#ff7675;">對手</div>
          <div style="color:#e74c3c; font-size:11px;">在線牌手</div>
        </div>
      </div>
    </div>

    <div style="flex:1; border:2px dashed rgba(245,208,97,0.4); border-radius:20px; margin:20px 0; display:flex; flex-direction:column; justify-content:space-around; align-items:center; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px);">
      <div style="text-align:center;">
        <div id="opponentCards" class="hand-cards">
          <div class="poker-card back">👑</div>
        </div>
        <div style="font-size: 11px; color:#ccc; margin-top:6px;">對手手牌</div>
      </div>

      <div style="background:rgba(0,0,0,0.7); padding:4px 18px; border-radius:20px; border:1px solid #dfb746; color:#f5d061; font-weight:bold; font-size:13px;">🪙 賭池: 10,000</div>

      <div style="text-align:center;">
        <div id="myCards" class="hand-cards"></div>
        <div style="font-size: 11px; color:#ccc; margin-top:6px;">你的手牌</div>
      </div>
    </div>

    <div style="display: flex; gap: 20px; justify-content: center;">
      <button id="drawBtn" class="btn-gold" style="width:160px; height:50px; font-size:17px; font-family:'Cinzel',serif;">抽一張牌</button>
      <button onclick="document.getElementById('gameMatchView').classList.add('hidden')" style="background:transparent; border:2px solid #e74c3c; color:#e74c3c; padding:10px 24px; border-radius:24px; font-weight:bold; cursor:pointer;">離開對局</button>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://game-server-mike.onrender.com";
    const socket = io(SERVER_URL);

    let currentUsername = "";
    let activeRoomId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('poker_player_name');
      if (savedName) {
        setPlayer(savedName);
      } else {
        openLoginModal(false);
      }
    });

    function openLoginModal(isEdit) {
      const modal = document.getElementById('loginModal');
      document.getElementById('loginModalTitle').innerText = isEdit ? "修改暱稱" : "牌手登入";
      document.getElementById('usernameInput').value = currentUsername || "";
      modal.classList.add('active');
    }

    function savePlayerName() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) return alert("暱稱不能為空！");
      localStorage.setItem('poker_player_name', name);
      setPlayer(name);
      document.getElementById('loginModal').classList.remove('active');
    }

    function setPlayer(name) {
      currentUsername = name;
      document.getElementById('playerNameText').innerText = name;
      const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}`;
      document.getElementById('playerAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyName').innerText = name;
    }

    document.getElementById('matchBtn').addEventListener('click', () => {
      if (!currentUsername) return openLoginModal(false);
      socket.emit('start_match', { playerName: currentUsername });
      document.getElementById('matchingModal').classList.add('active');
    });

    socket.on('game_start', (data) => {
      activeRoomId = data.roomId;
      document.getElementById('matchingModal').classList.remove('active');
      document.getElementById('gameMatchView').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = `🏆 賭神錦標賽 (${activeRoomId})`;

      for (const id in data.players) {
        if (id !== socket.id) {
          const oppName = data.players[id].name || "神秘牌手";
          document.getElementById('battleOppName').innerText = oppName;
          document.getElementById('battleOppAvatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(oppName)}')`;
        }
      }
      renderBoard(data.players);
    });

    document.getElementById('drawBtn').addEventListener('click', () => {
      socket.emit('draw_card', { roomId: activeRoomId });
    });

    socket.on('update_board', (data) => {
      renderBoard(data.players);
    });

    function renderBoard(players) {
      const myId = socket.id;
      const myCardsArea = document.getElementById('myCards');
      const oppCardsArea = document.getElementById('opponentCards');
      
      myCardsArea.innerHTML = '';
      oppCardsArea.innerHTML = '';

      for (const id in players) {
        if (id === myId) {
          players[id].cards.forEach(val => {
            const isRed = Math.random() > 0.5;
            const cardEl = document.createElement('div');
            cardEl.className = `poker-card ${isRed ? 'red' : ''}`;
            cardEl.innerHTML = `
              <div style="font-size:16px;">${val}</div>
              <div style="font-size:24px; align-self:center;">${isRed ? '♥️' : '♠️'}</div>
              <div style="font-size:16px; transform:rotate(180deg); align-self:flex-end;">${val}</div>
            `;
            myCardsArea.appendChild(cardEl);
          });
        } else {
          players[id].cards.forEach(() => {
            const cardBack = document.createElement('div');
            cardBack.className = 'poker-card back';
            cardBack.innerHTML = '👑';
            oppCardsArea.appendChild(cardBack);
          });
        }
      }
    }
  </script>
</body>
</html>
