<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>撲克手遊大廳</title>
  <!-- PWA 全螢幕手遊設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle, #1a2a3a 0%, #0d1520 100%);
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部資訊欄 */
    .top-bar {
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; }
    .coin-badge { background: #f39c12; color: #fff; padding: 4px 12px; border-radius: 20px; font-weight: bold; }

    /* 主畫面區塊 */
    .main-screen {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 左側功能按鈕（任務、簽到） */
    .side-buttons {
      position: absolute;
      left: 25px;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .side-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(5px);
    }
    .side-btn:active { background: rgba(255, 255, 255, 0.25); }

    /* 右下角大型矩形「開始遊戲」按鈕 */
    .play-btn-wrapper {
      position: absolute;
      right: 35px;
      bottom: 25px;
    }
    .big-play-btn {
      width: 220px;
      height: 80px;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .big-play-btn span { font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 4px; }
    .big-play-btn:active { transform: scale(0.96); }

    /* 遊戲模式彈窗 / 牌桌 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: #1e272e;
      border-radius: 12px;
      padding: 25px;
      width: 420px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .game-mode-btn {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #00d2d3;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 頂部資訊列 -->
  <div class="top-bar">
    <div class="user-info">
      <span id="playerTag">玩家：在線</span>
      <span class="coin-badge">💰 金幣: 10,000</span>
    </div>
    <div style="font-size: 14px; opacity: 0.7;">即時對戰系統已就緒</div>
  </div>

  <!-- 主畫面 -->
  <div class="main-screen">
    <!-- 左側系統按鈕 -->
    <div class="side-buttons">
      <button class="side-btn" onclick="alert('今日任務：完成 1 場多人配對對戰 (0/1)')">📜 任務清單</button>
      <button class="side-btn" onclick="alert('每日登入禮物已領取：獲得 500 金幣！')">🎁 每日禮物</button>
    </div>

    <div style="text-align: center;">
      <h1 style="font-size: 36px; letter-spacing: 3px;">POKER ARENA</h1>
      <p style="opacity: 0.6; margin-top: 8px;">選擇右下角模式即可開始即時對決</p>
    </div>

    <!-- 右下角大按鈕 -->
    <div class="play-btn-wrapper">
      <button id="openMatchModalBtn" class="big-play-btn">
        開始遊戲
        <span>真人即時配對</span>
      </button>
    </div>
  </div>

  <!-- 選擇遊戲模式 / 配對彈窗 -->
  <div id="matchModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 style="margin-bottom: 15px;">選擇配對模式</h2>
      <button id="startPairBtn" class="game-mode-btn">⚡ 經典快速對抗賽</button>
      <p id="matchStatusText" style="margin-top: 15px; color: #ff9f43; font-size: 14px;">點擊上方模式立即搜尋對手</p>
      <button onclick="document.getElementById('matchModal').classList.add('hidden')" style="margin-top: 15px; background: transparent; border: 1px solid #777; color: #ccc; padding: 6px 14px; border-radius: 6px;">關閉</button>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://game-server-mike.onrender.com";
    const socket = io(SERVER_URL);

    const openMatchModalBtn = document.getElementById('openMatchModalBtn');
    const matchModal = document.getElementById('matchModal');
    const startPairBtn = document.getElementById('startPairBtn');
    const matchStatusText = document.getElementById('matchStatusText');

    // 點擊右下角打開模式清單
    openMatchModalBtn.addEventListener('click', () => {
      matchModal.classList.remove('hidden');
    });

    // 點擊開始配對
    startPairBtn.addEventListener('click', () => {
      socket.emit('start_match');
      startPairBtn.disabled = true;
      startPairBtn.style.opacity = '0.5';
      matchStatusText.innerText = "正在搜尋全網線上玩家...";
    });

    // 配對成功事件（雙向監聽）
    function handleMatched(data) {
      matchStatusText.style.color = "#10ac84";
      matchStatusText.innerText = `配對成功！已分配到房間：${data.roomId}`;
      setTimeout(() => {
        alert(`成功進入房間：${data.roomId}！`);
      }, 300);
    }

    socket.on('matched', handleMatched);
    socket.on('game_start', handleMatched);
  </script>
</body>
</html>
