<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --gold: linear-gradient(135deg, #ffe066 0%, #d4af37 50%, #8c6b12 100%);
      --dark-panel: linear-gradient(180deg, rgba(28,38,32,0.95) 0%, rgba(10,18,14,0.95) 100%);
      --shadow-3d: 0 10px 25px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: 
        radial-gradient(circle at 50% 25%, rgba(212,175,55,0.2) 0%, transparent 60%),
        radial-gradient(circle at center, rgba(14,56,38,0.75) 0%, rgba(3,15,9,0.95) 100%),
        url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=1600&auto=format&fit=crop') no-repeat center center / cover;
      color: #fff; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }

    body::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
      pointer-events: none; z-index: 1;
    }

    #particlesCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }

    #clickCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
    }

    .hud-bar {
      height: 65px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 30px; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      z-index: 10; position: relative;
    }
    .player-profile {
      display: flex; align-items: center; gap: 12px;
      background: rgba(10,20,15,0.85); padding: 5px 20px 5px 6px;
      border-radius: 40px; border: 2px solid #d4af37; box-shadow: var(--shadow-3d);
      cursor: pointer; backdrop-filter: blur(8px);
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; border: 2px solid #d4af37;
      background: url('https://api.dicebear.com/7.x/adventurer/svg?seed=kato') no-repeat center/cover;
      box-shadow: 0 0 10px rgba(212,175,55,0.6);
    }
    .player-name { font-weight: 800; font-size: 16px; letter-spacing: 0.5px; }
    .trophy-badge { font-size: 12px; color: #f1c40f; display: flex; align-items: center; gap: 4px; font-weight: 600; }

    .currencies { display: flex; gap: 16px; }
    .currency-chip {
      background: rgba(10,20,15,0.85); border: 2px solid #d4af37;
      padding: 3px 14px 3px 6px; border-radius: 20px; font-weight: 800; font-size: 15px;
      display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-3d);
      font-family: 'Bebas Neue', sans-serif; backdrop-filter: blur(8px);
    }
    .currency-chip .icon {
      width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #fff;
    }
    .chip-purple .icon { background: #9b59b6; }
    .chip-gold .icon { background: linear-gradient(135deg, #f1c40f, #e67e22); border: 1.5px solid #fff; }
    .chip-green .icon { background: #2ecc71; }

    .left-menu {
      position: absolute; left: 25px; top: 90px; display: flex; flex-direction: column; gap: 14px; z-index: 5;
    }
    .menu-btn {
      width: 65px; height: 65px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(44,62,80,0.9) 0%, rgba(15,23,30,0.95) 100%);
      border: 2px solid #d4af37; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; transition: 0.15s;
      box-shadow: var(--shadow-3d); backdrop-filter: blur(6px);
    }
    .menu-btn:active { transform: scale(0.92); }
    .menu-btn span { font-size: 26px; }
    .menu-btn label { font-size: 11px; font-weight: 800; color: #f1c40f; margin-top: 2px; }

    .right-menu {
      position: absolute; right: 25px; top: 90px; display: flex; flex-direction: column; gap: 14px; z-index: 5;
    }
    .side-tag-btn {
      width: 75px; height: 55px; background: linear-gradient(135deg, rgba(30,39,46,0.9), rgba(47,54,64,0.95));

    }
    .side-tag-btn:active { transform: scale(0.92); }
    .side-tag-btn span { font-size: 22px; }

    .pass-container {
      position: absolute; left: 25px; bottom: 25px; z-index: 5;
      background: linear-gradient(90deg, rgba(16,26,20,0.95) 0%, rgba(20,38,30,0.9) 100%);
      border: 2.5px solid #d4af37; border-radius: 16px; width: 310px; height: 75px;
      display: flex; align-items: center; padding: 0 16px; gap: 14px; box-shadow: var(--shadow-3d);
      cursor: pointer; backdrop-filter: blur(8px);

    .pass-fill { width: 35%; height: 100%; background: linear-gradient(90deg, #f39c12, #f1c40f); }

    .center-visual {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);

    .dealer-suit { text-shadow: 0 15px 35px rgba(0,0,0,0.9); text-align: center; font-size: 210px; line-height: 0.8; }
    .logo-glow {

    .battle-center {

    .play-btn {
      width: 260px; height: 80px; background: linear-gradient(135deg, #ffe066, #d4af37, #8c6b12);
      border: 3.5px solid #fff; border-radius: 18px; color: #1e272e; font-size: 30px; font-weight: 900;
      letter-spacing: 4px; font-family: 'Cinzel', serif; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(212,175,55,0.7), inset 0 2px 5px #fff;
    }
    .play-btn:active { transform: scale(0.95); }
    .play-btn label { font-size: 12px; font-weight: 800; font-family: 'Outfit', sans-serif; opacity: 0.9; color: #111; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
      align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.25s ease;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--dark-panel); border-radius: 24px; padding: 32px; width: 480px; text-align: center;
      border: 3px solid #d4af37; box-shadow: 0 0 50px rgba(212,175,55,0.5);

    .modal-title { font-family: 'Cinzel', serif; color: #f1c40f; font-size: 26px; margin-bottom: 20px; }
    .login-input {
      width: 80%; padding: 14px 18px; font-size: 18px; font-weight: bold;
      border: 2px solid #d4af37; border-radius: 12px; background: rgba(0,0,0,0.75);
      color: #fff; text-align: center; outline: none; margin: 20px 0;
    }
    .btn-action {
      background: linear-gradient(135deg, #f1c40f, #d4af37); color: #000; border: none;

    .game-match-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(14,56,38,0.92) 0%, rgba(3,15,9,0.98) 100%),

    .players-status { display: flex; justify-content: space-between; align-items: center; }
    .battle-avatar-card {
      background: rgba(0,0,0,0.85); border: 2px solid #d4af37; padding: 8px 18px; border-radius: 16px;
      display: flex; align-items: center; gap: 12px; width: 230px; box-shadow: var(--shadow-3d);
    }
    .card-board {
      border: 3px dashed rgba(212,175,55,0.4); border-radius: 20px; flex: 1; margin: 20px 0;
      display: flex; flex-direction: column; justify-content: space-around; position: relative;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    }
    .hand-cards { display: flex; justify-content: center; gap: 15px; margin-top: 10px; min-height: 105px; }
    
    .poker-card {
      width: 75px; height: 105px; background: #fff; border-radius: 8px; border: 2px solid #000;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between;
      padding: 8px; font-weight: bold; color: #1e272e;
      animation: dealCard 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .poker-card.red { color: #e74c3c; }
    .poker-card.back {
      background: linear-gradient(135deg, #c0392b, #962d22); border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }

    @keyframes dealCard {
      0% {
        opacity: 0;
        transform: translateY(-160px) rotate(-25deg) scale(0.6);
        box-shadow: 0 25px 35px rgba(0,0,0,0.8);
      }
      70% {
        transform: translateY(8px) rotate(4deg) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
        box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      }
    }

    .hidden { display: none !important; }
  </style>
</head>

  <script>
    // ==========================================
    // 水滴微泡泡破裂音效引擎 (Water Bubble Pop Engine)
    // ==========================================
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // 點擊：彈性「啵」水泡破裂音 (急速上滑波形)
      playBubblePop() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        // 隨機在 450Hz ~ 700Hz 起音，並向上彈射到高頻
        const startFreq = 480 + (Math.random() * 180);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(startFreq * 2.2, now + 0.045);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.06);
      },
      // 發牌：連續冒泡音效 (三顆小水泡連續躍出)
      playBubbleStream() {
        this.init();
        const pitches = [550, 780, 1050];
        pitches.forEach((freq, idx) => {
          const delay = idx * 0.038;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.8, now + 0.04);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.055);
        });
      }
    };

    // 背景金粉漂浮
    const canvas = document.getElementById('particlesCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 0.8,
        speedY: -(Math.random() * 0.4 + 0.15),
        speedX: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.7 + 0.2
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f1c40f";
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // 點擊爆破特效
    const clickCanvas = document.getElementById('clickCanvas');
    const cCtx = clickCanvas.getContext('2d');
    let clickParticles = [];
    let clickRings = [];

    function resizeClickCanvas() {
      clickCanvas.width = window.innerWidth;
      clickCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeClickCanvas);
    resizeClickCanvas();

    class ClickSparkle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1.5;
        this.size = Math.random() * 4 + 2;
        this.color = Math.random() > 0.3 ? '#fce072' : '#ffffff';
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.isDiamond = Math.random() > 0.6;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.18;
        this.alpha -= this.decay;
      }
      draw() {
        cCtx.save();
        cCtx.globalAlpha = Math.max(0, this.alpha);
        cCtx.fillStyle = this.color;
        cCtx.shadowColor = '#d4af37';
        cCtx.shadowBlur = 8;
        if (this.isDiamond) {
          cCtx.font = `${this.size * 3}px serif`;
          cCtx.fillText('♦', this.x, this.y);
        } else {
          cCtx.beginPath();
          cCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          cCtx.fill();
        }
        cCtx.restore();
      }
    }

    class ClickRing {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 3;
        this.alpha = 0.9;
      }
      update() {
        this.radius += 3.2;
        this.alpha -= 0.045;
      }
      draw() {
        cCtx.save();
        cCtx.globalAlpha = Math.max(0, this.alpha);
        cCtx.strokeStyle = '#f1c40f';
        cCtx.lineWidth = 2.5;
        cCtx.shadowColor = '#ffe066';
        cCtx.shadowBlur = 10;
        cCtx.beginPath();
        cCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        cCtx.stroke();
        cCtx.restore();
      }
    }

    function triggerClickBurst(x, y) {
      AudioEngine.playBubblePop();
      clickRings.push(new ClickRing(x, y));
      for (let i = 0; i < 18; i++) {
        clickParticles.push(new ClickSparkle(x, y));
      }
    }

    window.addEventListener('pointerdown', (e) => {
      triggerClickBurst(e.clientX, e.clientY);
    });

    function renderClickEffects() {
      cCtx.clearRect(0, 0, clickCanvas.width, clickCanvas.height);

      for (let i = clickRings.length - 1; i >= 0; i--) {
        clickRings[i].update();
        clickRings[i].draw();
        if (clickRings[i].alpha <= 0) clickRings.splice(i, 1);
      }

      for (let i = clickParticles.length - 1; i >= 0; i--) {
        clickParticles[i].update();
        clickParticles[i].draw();
        if (clickParticles[i].alpha <= 0) clickParticles.splice(i, 1);
      }

      requestAnimationFrame(renderClickEffects);
    }
    renderClickEffects();

    // 遊戲連線與 HUD 邏輯
    const SERVER_URL = "https://game-server-mike.onrender.com";
    const socket = io(SERVER_URL);

    let currentUsername = "";
    let activeRoomId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('poker_player_name');
      if (savedName) {
        setPlayer(savedName);
      } else {
        openLoginModal(false);
      }
    });

    function openLoginModal(isEdit) {
      const modal = document.getElementById('loginModal');
      document.getElementById('loginModalTitle').innerText = isEdit ? "修改暱稱" : "牌手登入";
      document.getElementById('usernameInput').value = currentUsername || "";
      modal.classList.add('active');
    }

    function savePlayerName() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) return alert("暱稱不能為空！");
      localStorage.setItem('poker_player_name', name);
      setPlayer(name);
      document.getElementById('loginModal').classList.remove('active');
    }

    function setPlayer(name) {
      currentUsername = name;
      document.getElementById('playerNameText').innerText = name;
      const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}`;
      document.getElementById('playerAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyName').innerText = name;
    }

    document.getElementById('matchBtn').addEventListener('click', () => {
      if (!currentUsername) return openLoginModal(false);
      socket.emit('start_match', { playerName: currentUsername });
      document.getElementById('matchingModal').classList.add('active');
    });

    socket.on('game_start', (data) => {
      activeRoomId = data.roomId;
      document.getElementById('matchingModal').classList.remove('active');
      document.getElementById('gameMatchView').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = `🏆 賭神賽 (${activeRoomId})`;

      for (const id in data.players) {
        if (id !== socket.id) {
          const oppName = data.players[id].name || "神秘牌手";
          document.getElementById('battleOppName').innerText = oppName;
          document.getElementById('battleOppAvatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(oppName)}')`;
        }
      }
      AudioEngine.playBubbleStream();
      renderBoard(data.players);
    });

    document.getElementById('drawBtn').addEventListener('click', () => {
      AudioEngine.playBubbleStream();
      socket.emit('draw_card', { roomId: activeRoomId });
    });

    socket.on('update_board', (data) => {
      AudioEngine.playBubbleStream();
      renderBoard(data.players);
    });

    function renderBoard(players) {
      const myId = socket.id;
      const myCardsArea = document.getElementById('myCards');
      const oppCardsArea = document.getElementById('opponentCards');
      
      myCardsArea.innerHTML = '';
      oppCardsArea.innerHTML = '';

      for (const id in players) {
        if (id === myId) {
          players[id].cards.forEach(val => {
            const isRed = Math.random() > 0.5;
            const cardEl = document.createElement('div');
            cardEl.className = `poker-card ${isRed ? 'red' : ''}`;
            cardEl.innerHTML = `
              <div style="font-size:18px;">${val}</div>
              <div style="font-size:26px; align-self:center;">${isRed ? '♥️' : '♠️'}</div>
              <div style="font-size:18px; transform:rotate(180deg); align-self:flex-end;">${val}</div>
            `;
            myCardsArea.appendChild(cardEl);
          });
        } else {
          players[id].cards.forEach(() => {
            const cardBack = document.createElement('div');
            cardBack.className = 'poker-card back';
            cardBack.innerHTML = '👑';
            oppCardsArea.appendChild(cardBack);
          });
        }
      }
    }
  </script>
</body>
</html>
