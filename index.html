<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POKER ARENA - VIP CASINO</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --gold: linear-gradient(135deg, #ffe066 0%, #d4af37 50%, #8c6b12 100%);
      --dark-panel: linear-gradient(180deg, rgba(28,38,32,0.95) 0%, rgba(10,18,14,0.95) 100%);
      --shadow-3d: 0 10px 25px rgba(0,0,0,0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: radial-gradient(circle at center, #0d281e 0%, #05140d 60%, #000 100%);
      color: #fff; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }

    /* 頂部 HUD */
    .hud-bar {
      height: 60px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 25px; background: rgba(0,0,0,0.7); border-bottom: 1px solid rgba(212,175,55,0.3);
      z-index: 10;
    }
    .player-profile {
      display: flex; align-items: center; gap: 10px;
      background: rgba(10,20,15,0.9); padding: 4px 16px 4px 6px;
      border-radius: 40px; border: 2px solid #d4af37; cursor: pointer;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid #d4af37;
      background: url('https://api.dicebear.com/7.x/adventurer/svg?seed=kato') no-repeat center/cover;
    }
    .player-name { font-weight: 800; font-size: 15px; }
    .currencies { display: flex; gap: 12px; }
    .currency-chip {
      background: rgba(10,20,15,0.9); border: 1.5px solid #d4af37;
      padding: 3px 12px; border-radius: 20px; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; gap: 6px; font-family: 'Bebas Neue', sans-serif;
    }

    /* 中央整個可見的實體豪華賭桌 */
    .table-stage {
      flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2;
    }
    .casino-felt-table {
      width: 68vw; height: 62vh; border-radius: 120px;
      background: radial-gradient(ellipse at center, #1b533c 0%, #103828 65%, #082117 100%);
      border: 14px solid #3d2314; /* 胡桃木圍邊 */
      box-shadow: 
        0 0 0 4px #d4af37,
        0 15px 40px rgba(0,0,0,0.9),
        inset 0 0 25px rgba(0,0,0,0.7);
      position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: space-around; padding: 20px;
    }

    /* 賭桌標線與光暈印花 */
    .table-inner-ring {
      position: absolute; inset: 15px; border-radius: 100px;
      border: 2px dashed rgba(212,175,55,0.4); pointer-events: none;
    }
    .table-logo {
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 28px; letter-spacing: 6px;
      color: rgba(212, 175, 55, 0.4); text-align: center; pointer-events: none;
    }

    /* 實體籌碼堆 */
    .table-chips {
      position: absolute; display: flex; gap: 8px;
    }
    .chips-left { left: 40px; top: 50%; transform: translateY(-50%); }
    .chips-right { right: 40px; top: 50%; transform: translateY(-50%); }

    .chip {
      width: 44px; height: 44px; border-radius: 50%; border: 4px dashed #fff;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
      font-size: 11px; box-shadow: 0 6px 12px rgba(0,0,0,0.6);
    }
    .chip.c-red { background: radial-gradient(circle, #e74c3c 40%, #962d22 100%); }
    .chip.c-blue { background: radial-gradient(circle, #3498db 40%, #1b4f72 100%); }
    .chip.c-gold { background: radial-gradient(circle, #f1c40f 40%, #b7950b 100%); color: #000; border-color: #000; }

    /* 左側選單 */
    .left-menu {
      position: absolute; left: 20px; top: 80px; display: flex; flex-direction: column; gap: 12px; z-index: 5;
    }
    .menu-btn {
      width: 60px; height: 60px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(44,62,80,0.9), rgba(15,23,30,0.95));
      border: 2px solid #d4af37; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .menu-btn span { font-size: 24px; }
    .menu-btn label { font-size: 10px; font-weight: bold; color: #f1c40f; }

    /* 右下角大對戰按鈕 */
    .play-box {
      position: absolute; right: 25px; bottom: 25px; z-index: 6;
    }
    .play-btn {
      width: 220px; height: 75px; background: linear-gradient(135deg, #ffe066, #d4af37, #8c6b12);
      border: 3px solid #fff; border-radius: 16px; color: #1e272e; font-size: 28px; font-weight: 900;
      letter-spacing: 3px; font-family: 'Cinzel', serif; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(212,175,55,0.6);
    }
    .play-btn label { font-size: 11px; font-weight: 800; font-family: 'Outfit', sans-serif; }

    /* 通行證 */
    .pass-container {
      position: absolute; left: 20px; bottom: 20px; z-index: 5;
      background: rgba(10,20,15,0.9); border: 2px solid #d4af37; border-radius: 14px;
      width: 260px; height: 65px; display: flex; align-items: center; padding: 0 14px; gap: 12px;
      cursor: pointer;
    }

    /* 登入彈窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; justify-content: center; align-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--dark-panel); border-radius: 20px; padding: 25px; width: 420px;
      text-align: center; border: 2.5px solid #d4af37;
    }
    .login-input {
      width: 80%; padding: 12px; font-size: 16px; font-weight: bold;
      border: 2px solid #d4af37; border-radius: 10px; background: #000;
      color: #fff; text-align: center; outline: none; margin: 15px 0;
    }
    .btn-action {
      background: linear-gradient(135deg, #f1c40f, #d4af37); color: #000; border: none;
      border-radius: 20px; padding: 8px 24px; font-size: 15px; font-weight: bold; cursor: pointer;
    }

    /* 對戰牌桌 */
    .game-match-view {
      position: fixed; inset: 0; background: #081a12; z-index: 120;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px 30px;
    }
    .poker-card {
      width: 70px; height: 98px; background: #fff; border-radius: 8px; border: 2px solid #000;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between;
      padding: 6px; font-weight: bold; color: #1e272e;
    }
    .poker-card.red { color: #e74c3c; }
    .poker-card.back {
      background: linear-gradient(135deg, #c0392b, #962d22); border: 2.5px solid #fff;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 頂部 HUD -->
  <div class="hud-bar">
    <div class="player-profile" onclick="openLoginModal(true)">
      <div id="playerAvatar" class="avatar"></div>
      <div>
        <div id="playerNameText" class="player-name">VIP 牌手</div>
        <div style="font-size: 11px; color:#f1c40f;">🏆 1,200 點</div>
      </div>
    </div>
    
    <div class="currencies">
      <div class="currency-chip">💜 999</div>
      <div class="currency-chip">🪙 23,189</div>
      <div class="currency-chip">💚 1,000,000</div>
    </div>
  </div>

  <!-- 左側選單 -->
  <div class="left-menu">
    <div class="menu-btn" onclick="alert('商店功能籌備中')"><span>🛒</span><label>商店</label></div>
    <div class="menu-btn" onclick="openLoginModal(true)"><span>🎴</span><label>改名</label></div>
    <div class="menu-btn" onclick="alert('巡迴賽火熱開打！')"><span>📰</span><label>新聞</label></div>
  </div>

  <!-- 中央舞台：真實輪廓賭桌 -->
  <div class="table-stage">
    <div class="casino-felt-table">
      <div class="table-inner-ring"></div>
      
      <!-- 桌面籌碼堆 -->
      <div class="table-chips chips-left">
        <div class="chip c-red">500</div>
        <div class="chip c-gold">10K</div>
      </div>

      <div class="table-logo">
        <div>POKER ARENA</div>
        <div style="font-size: 12px; letter-spacing: 2px; margin-top: 4px; opacity: 0.7;">TEXAS VIP TABLE</div>
      </div>

      <div class="table-chips chips-right">
        <div class="chip c-blue">1K</div>
        <div class="chip c-gold">5K</div>
      </div>
    </div>
  </div>

  <!-- 左下通行證 -->
  <div class="pass-container" onclick="alert('通行證：即將解鎖黃金寶箱！')">
    <div style="font-size: 28px;">🎫</div>
    <div>
      <div style="font-size: 12px; font-weight: bold; color: #ffe066;">賭金通行證</div>
      <div style="font-size: 10px; color: #aaa;">350 / 500 積分</div>
    </div>
    <div style="font-size: 22px; margin-left: auto;">🎁</div>
  </div>

  <!-- 右下對戰按鈕 -->
  <div class="play-box">
    <button id="matchBtn" class="play-btn">
      對戰
      <label>1v1 真人配對</label>
    </button>
  </div>

  <!-- 登入改名彈窗 -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="loginModalTitle" style="color:#f1c40f; margin-bottom:10px;">牌手登入</h2>
      <p style="color: #bbb; font-size: 13px;">請輸入你的遊戲暱稱：</p>
      <input type="text" id="usernameInput" class="login-input" placeholder="輸入暱稱..." maxlength="12">
      <div>
        <button class="btn-action" onclick="savePlayerName()">確定</button>
      </div>
    </div>
  </div>

  <!-- 配對中彈窗 -->
  <div id="matchingModal" class="modal-overlay">
    <div class="modal-box" style="width: 320px;">
      <h3 style="color:#f1c40f; margin-bottom: 15px;">搜尋對手中...</h3>
      <div style="font-size: 40px; margin: 15px 0;">♣️♥️♦️♠️</div>
      <button onclick="document.getElementById('matchingModal').classList.remove('active')" style="background:#e74c3c; color:#fff; border:none; padding:6px 18px; border-radius:15px; cursor:pointer;">取消</button>
    </div>
  </div>

  <!-- 對戰牌桌 -->
  <div id="gameMatchView" class="game-match-view hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div id="battleMyName" style="font-weight:bold; color:#4cd137;">我方</div>
      <div id="roomTitle" style="color:#f1c40f; font-family:'Cinzel',serif; font-size:18px;">房間</div>
      <div id="battleOppName" style="font-weight:bold; color:#ff7675;">對手</div>
    </div>

    <div style="flex:1; border:2px dashed rgba(212,175,55,0.4); border-radius:16px; margin:15px 0; display:flex; flex-direction:column; justify-content:space-around; align-items:center;">
      <div id="opponentCards" style="display:flex; gap:10px;">
        <div class="poker-card back">👑</div>
      </div>
      <div id="myCards" style="display:flex; gap:10px;"></div>
    </div>

    <div style="display:flex; gap:15px; justify-content:center;">
      <button id="drawBtn" style="padding:10px 24px; font-size:16px; font-weight:bold; background:var(--gold); border:none; border-radius:10px; cursor:pointer;">抽一張牌</button>
      <button onclick="document.getElementById('gameMatchView').classList.add('hidden')" style="padding:10px 20px; background:transparent; border:2px solid #e74c3c; color:#e74c3c; border-radius:10px; cursor:pointer;">離開</button>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://game-server-mike.onrender.com";
    const socket = io(SERVER_URL);

    let currentUsername = "";
    let activeRoomId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('poker_player_name');
      if (savedName) {
        setPlayer(savedName);
      } else {
        openLoginModal(false);
      }
    });

    function openLoginModal(isEdit) {
      const modal = document.getElementById('loginModal');
      document.getElementById('loginModalTitle').innerText = isEdit ? "修改暱稱" : "牌手登入";
      document.getElementById('usernameInput').value = currentUsername || "";
      modal.classList.add('active');
    }

    function savePlayerName() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) return alert("暱稱不能為空！");
      localStorage.setItem('poker_player_name', name);
      setPlayer(name);
      document.getElementById('loginModal').classList.remove('active');
    }

    function setPlayer(name) {
      currentUsername = name;
      document.getElementById('playerNameText').innerText = name;
      const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}`;
      document.getElementById('playerAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyName').innerText = name;
    }

    document.getElementById('matchBtn').addEventListener('click', () => {
      if (!currentUsername) return openLoginModal(false);
      socket.emit('start_match', { playerName: currentUsername });
      document.getElementById('matchingModal').classList.add('active');
    });

    socket.on('game_start', (data) => {
      activeRoomId = data.roomId;
      document.getElementById('matchingModal').classList.remove('active');
      document.getElementById('gameMatchView').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = `房間: ${activeRoomId}`;

      for (const id in data.players) {
        if (id !== socket.id) {
          document.getElementById('battleOppName').innerText = data.players[id].name || "對手";
        }
      }
      renderBoard(data.players);
    });

    document.getElementById('drawBtn').addEventListener('click', () => {
      socket.emit('draw_card', { roomId: activeRoomId });
    });

    socket.on('update_board', (data) => {
      renderBoard(data.players);
    });

    function renderBoard(players) {
      const myId = socket.id;
      const myCardsArea = document.getElementById('myCards');
      const oppCardsArea = document.getElementById('opponentCards');
      
      myCardsArea.innerHTML = '';
      oppCardsArea.innerHTML = '';

      for (const id in players) {
        if (id === myId) {
          players[id].cards.forEach(val => {
            const isRed = Math.random() > 0.5;
            const cardEl = document.createElement('div');
            cardEl.className = `poker-card ${isRed ? 'red' : ''}`;
            cardEl.innerHTML = `
              <div style="font-size:16px;">${val}</div>
              <div style="font-size:24px; align-self:center;">${isRed ? '♥️' : '♠️'}</div>
              <div style="font-size:16px; transform:rotate(180deg); align-self:flex-end;">${val}</div>
            `;
            myCardsArea.appendChild(cardEl);
          });
        } else {
          players[id].cards.forEach(() => {
            const cardBack = document.createElement('div');
            cardBack.className = 'poker-card back';
            cardBack.innerHTML = '👑';
            oppCardsArea.appendChild(cardBack);
          });
        }
      }
    }
  </script>
</body>
</html>
