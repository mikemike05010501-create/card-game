<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POKER ARENA - 奢華黑金 VIP 賭城</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --gold: linear-gradient(135deg, #ffe066 0%, #d4af37 50%, #8c6b12 100%);
      --green-felt: radial-gradient(circle at center, #1b4d3e 0%, #0d2c20 70%, #05140e 100%);
      --dark-panel: linear-gradient(180deg, #2c3531 0%, #111a16 100%);
      --shadow-3d: 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; }
    
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: var(--green-felt);
      color: #fff; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }

    /* 頂部 HUD */
    .hud-bar {
      height: 65px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 30px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      z-index: 10; position: relative;
    }
    .player-profile {
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,0,0,0.6); padding: 5px 20px 5px 6px;
      border-radius: 40px; border: 2px solid #d4af37; box-shadow: var(--shadow-3d);
      cursor: pointer; transition: 0.2s;
    }
    .player-profile:active { transform: scale(0.95); }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; border: 2px solid #d4af37;
      background: url('https://api.dicebear.com/7.x/adventurer/svg?seed=poker') no-repeat center/cover;
      box-shadow: 0 0 10px rgba(212,175,55,0.5);
    }
    .player-name { font-weight: 800; font-size: 16px; letter-spacing: 0.5px; }
    .trophy-badge { font-size: 12px; color: #f1c40f; display: flex; align-items: center; gap: 3px; font-weight: 600; }

    .currencies { display: flex; gap: 16px; }
    .currency-chip {
      background: rgba(13,28,20,0.85); border: 2.5px solid #d4af37;
      padding: 3px 14px 3px 6px; border-radius: 20px; font-weight: 800; font-size: 15px;
      display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-3d);
      font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.5px;
    }
    .currency-chip .icon {
      width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: normal; color: #fff;
    }
    .chip-purple .icon { background: #9b59b6; }
    .chip-gold .icon { background: linear-gradient(135deg, #f1c40f, #e67e22); border: 1.5px solid #fff; }
    .chip-green .icon { background: #2ecc71; }

    /* 左側選單 */
    .left-menu {
      position: absolute; left: 25px; top: 90px; display: flex; flex-direction: column; gap: 14px; z-index: 5;
    }
    .menu-btn {
      width: 65px; height: 65px; border-radius: 14px;
      background: linear-gradient(135deg, #2c3e50 0%, #0f171e 100%);
      border: 2px solid #d4af37; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; transition: 0.15s;
      box-shadow: var(--shadow-3d); position: relative;
    }
    .menu-btn:active { transform: scale(0.9); }
    .menu-btn span { font-size: 26px; }
    .menu-btn label { font-size: 11px; font-weight: 800; color: #f1c40f; margin-top: 2px; }

    /* 右側選單 */
    .right-menu {
      position: absolute; right: 25px; top: 90px; display: flex; flex-direction: column; gap: 14px; z-index: 5;
    }
    .side-tag-btn {
      width: 75px; height: 55px; background: linear-gradient(135deg, #1e272e, #2f3640);
      border: 2px solid rgba(212,175,55,0.6); border-radius: 12px; font-size: 12px; font-weight: bold;
      color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; box-shadow: var(--shadow-3d);
    }
    .side-tag-btn:active { transform: scale(0.92); }
    .side-tag-btn span { font-size: 22px; }

    /* 賭金通行證 */
    .pass-container {
      position: absolute; left: 25px; bottom: 25px; z-index: 5;
      background: linear-gradient(90deg, #101a14 0%, rgba(20,38,30,0.95) 100%);
      border: 2.5px solid #d4af37; border-radius: 16px; width: 310px; height: 75px;
      display: flex; align-items: center; padding: 0 16px; gap: 14px; box-shadow: var(--shadow-3d);
      cursor: pointer;
    }
    .pass-badge { font-size: 34px; }
    .pass-progress { flex: 1; }
    .pass-bar { height: 12px; background: #000; border-radius: 6px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.15); margin-top: 4px; }
    .pass-fill { width: 35%; height: 100%; background: linear-gradient(90deg, #f39c12, #f1c40f); }

    /* 中央人物 */
    .center-visual {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 480px; height: 85vh; pointer-events: none; z-index: 2;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    }
    .dealer-suit { text-shadow: 0 15px 30px rgba(0,0,0,0.9); text-align: center; font-size: 210px; line-height: 0.8; }
    .logo-glow {
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 32px; letter-spacing: 4px;
      background: linear-gradient(135deg, #ffe066 0%, #d4af37 50%, #f39c12 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 120px; text-align: center;
    }

    /* 右下角對戰按鈕 */
    .battle-center {
      position: absolute; right: 25px; bottom: 25px; z-index: 6; display: flex; flex-direction: column; gap: 10px;
    }
    .battle-mode-bar {
      width: 260px; background: rgba(0,0,0,0.8); border: 2px solid #d4af37;
      padding: 8px 14px; border-radius: 12px; text-align: center; color: #e1b12c; font-size: 12px; font-weight: bold;
      box-shadow: var(--shadow-3d);
    }
    .battle-mode-bar span { font-family: 'Cinzel', serif; font-size: 16px; color: #fff; display: block; margin-bottom: 2px; }

    .play-btn {
      width: 260px; height: 80px; background: linear-gradient(135deg, #ffe066, #d4af37, #8c6b12);
      border: 3.5px solid #fff; border-radius: 18px; color: #1e272e; font-size: 30px; font-weight: 900;
      letter-spacing: 4px; font-family: 'Cinzel', serif; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(212,175,55,0.7), inset 0 2px 5px #fff;
    }
    .play-btn:active { transform: scale(0.95); }
    .play-btn label { font-size: 12px; font-weight: 800; font-family: 'Outfit', sans-serif; opacity: 0.9; color: #111; }

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center;
      align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--dark-panel); border-radius: 24px; padding: 30px; width: 480px; text-align: center;
      border: 3px solid #d4af37; box-shadow: 0 0 50px rgba(212,175,55,0.4);
    }
    .modal-title { font-family: 'Cinzel', serif; color: #f1c40f; font-size: 26px; margin-bottom: 20px; }

    /* 輸入框樣式（手遊登入） */
    .input-group { margin: 20px 0; }
    .login-input {
      width: 80%; padding: 14px 18px; font-size: 18px; font-weight: bold;
      border: 2px solid #d4af37; border-radius: 12px; background: rgba(0,0,0,0.7);
      color: #fff; text-align: center; outline: none; letter-spacing: 1px;
    }
    .login-input:focus { border-color: #ffe066; box-shadow: 0 0 15px rgba(212,175,55,0.6); }

    .btn-action {
      background: linear-gradient(135deg, #f1c40f, #d4af37); color: #000; border: none;
      border-radius: 30px; padding: 10px 30px; font-size: 16px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 15px rgba(212,175,55,0.4); margin-top: 10px;
    }
    .btn-action:active { transform: scale(0.95); }

    /* 對戰牌桌 1v1 */
    .game-match-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--green-felt); z-index: 120; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 40px;
    }
    .players-status { display: flex; justify-content: space-between; align-items: center; }
    .battle-avatar-card {
      background: rgba(0,0,0,0.85); border: 2px solid #d4af37; padding: 8px 18px; border-radius: 16px;
      display: flex; align-items: center; gap: 12px; width: 230px; box-shadow: var(--shadow-3d);
    }
    .card-board {
      border: 3px dashed rgba(212,175,55,0.35); border-radius: 20px; flex: 1; margin: 20px 0;
      display: flex; flex-direction: column; justify-content: space-around; position: relative;
      background: radial-gradient(circle, rgba(27,77,62,0.3) 0%, rgba(0,0,0,0.6) 100%);
    }
    .hand-cards { display: flex; justify-content: center; gap: 15px; margin-top: 10px; min-height: 105px; }
    .poker-card {
      width: 75px; height: 105px; background: #fff; border-radius: 8px; border: 2px solid #000;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between;
      padding: 8px; font-weight: bold; color: #1e272e;
    }
    .poker-card.red { color: #e74c3c; }
    .poker-card.back {
      background: linear-gradient(135deg, #c0392b, #962d22); border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. 頂部 HUD (左上角可點擊改名) -->
  <div class="hud-bar">
    <div class="player-profile" onclick="openLoginModal(true)" title="點擊修改暱稱">
      <div id="playerAvatar" class="avatar"></div>
      <div>
        <div id="playerNameText" class="player-name">未登入</div>
        <div class="trophy-badge">🏆 1,200 <span>VIP 牌手</span></div>
      </div>
    </div>
    
    <div class="currencies">
      <div class="currency-chip chip-purple"><div class="icon">💜</div><span>999</span></div>
      <div id="coinCount" class="currency-chip chip-gold"><div class="icon">🪙</div><span>23,189</span></div>
      <div class="currency-chip chip-green"><div class="icon">💚</div><span>1,000,000</span></div>
    </div>
  </div>

  <!-- 2. 左側選單 -->
  <div class="left-menu">
    <div class="menu-btn" onclick="alert('商店系統建置中！')"><span>🛒</span><label>商店</label></div>
    <div class="menu-btn" onclick="openLoginModal(true)"><span>🎴</span><label>改名</label></div>
    <div class="menu-btn" onclick="alert('1v1 賭神賽火熱進行中！')"><span>📰</span><label>新聞</label></div>
  </div>

  <!-- 3. 通行證 -->
  <div class="pass-container">
    <div class="pass-badge">🎫</div>
    <div class="pass-progress">
      <div style="font-size: 12px; font-weight: 800; color: #ffe066;">賭金通行證 (VIP Pass)</div>
      <div class="pass-bar"><div class="pass-fill"></div></div>
    </div>
    <div style="font-size: 24px;">🎁</div>
  </div>

  <!-- 4. 中央人物 -->
  <div class="center-visual">
    <div class="dealer-suit">🎩🤵</div>
    <div class="logo-glow">POKER ARENA</div>
  </div>

  <!-- 5. 右側選單 -->
  <div class="right-menu">
    <button class="side-tag-btn" onclick="alert('在線好友：3人')"><span>👥</span>好友</button>
    <button class="side-tag-btn" onclick="alert('小隊功能即將開放')"><span>🏠</span>小隊</button>
    <button class="side-tag-btn" onclick="alert('戰隊競賽中')"><span>🏅</span>戰隊</button>
  </div>

  <!-- 6. 右下角開始對戰 -->
  <div class="battle-center">
    <div class="battle-mode-bar">
      <span>經典快速對決</span>
      🏆 1v1 賭神巡迴賽
    </div>
    <button id="matchBtn" class="play-btn">
      對戰
      <label>真人即時配對</label>
    </button>
  </div>

  <!-- 🪪 登入 / 建立角色彈窗 -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="loginModalTitle" class="modal-title">牌手登入</h2>
      <p style="color: #bbb; font-size: 14px;">請輸入你的遊戲暱稱以加入對戰：</p>
      
      <div class="input-group">
        <input type="text" id="usernameInput" class="login-input" placeholder="輸入玩家暱稱..." maxlength="12">
      </div>

      <button class="btn-action" onclick="savePlayerName()">進入遊戲</button>
    </div>
  </div>

  <!-- ⏳ 配對中彈窗 -->
  <div id="matchingModal" class="modal-overlay">
    <div class="modal-box" style="width: 380px;">
      <h2 style="color:#f1c40f; font-family:'Cinzel',serif;">搜尋對手中...</h2>
      <div style="font-size: 50px; margin: 20px 0;">♣️♥️♦️♠️</div>
      <p style="color: #ccc; font-size: 14px;">正在尋找實力相近的牌手...</p>
      <button onclick="document.getElementById('matchingModal').classList.remove('active')" style="margin-top:20px; background:#e74c3c; color:#fff; border:none; padding:8px 20px; border-radius:20px; font-weight:bold; cursor:pointer;">取消配對</button>
    </div>
  </div>

  <!-- 🃏 對戰牌桌 -->
  <div id="gameMatchView" class="game-match-view hidden">
    <div class="players-status">
      <!-- 我方 -->
      <div class="battle-avatar-card">
        <div id="battleMyAvatar" class="avatar" style="width:36px; height:36px;"></div>
        <div>
          <div id="battleMyName" style="font-weight: 800; font-size: 14px;">我方</div>
          <div style="color:#4cd137; font-size:11px;">你的手牌</div>
        </div>
      </div>
      <h2 id="roomTitle" style="color: #f1c40f; font-family:'Cinzel', serif; font-size: 20px;">🏆 賭神賽</h2>
      <!-- 對手 -->
      <div class="battle-avatar-card" style="flex-direction: row-reverse; text-align: right; border-color: #e74c3c;">
        <div id="battleOppAvatar" class="avatar" style="width:36px; height:36px;"></div>
        <div>
          <div id="battleOppName" style="font-weight: 800; font-size: 14px; color:#ff7675;">對手</div>
          <div style="color:#e74c3c; font-size:11px;">在線牌手</div>
        </div>
      </div>
    </div>

    <div class="card-board">
      <div style="text-align: center;">
        <div id="opponentCards" class="hand-cards">
          <div class="poker-card back">👑</div>
        </div>
        <div style="font-size: 11px; color:#aaa; margin-top:8px;">對手手牌區</div>
      </div>

      <div style="text-align: center;">
        <div style="display:inline-block; background:rgba(0,0,0,0.6); padding:4px 14px; border-radius:20px; border:1.5px solid #d4af37; color:#f1c40f; font-size:13px; font-weight:bold;">🪙 賭池: 10,000</div>
      </div>

      <div style="text-align: center;">
        <div id="myCards" class="hand-cards"></div>
        <div style="font-size: 11px; color:#aaa; margin-top:8px;">你的手牌區</div>
      </div>
    </div>

    <div style="display: flex; gap: 20px; justify-content: center;">
      <button id="drawBtn" style="width:160px; height:50px; font-size:18px; font-weight:800; border-radius:12px; background:var(--gold); border:2px solid #fff; cursor:pointer;">抽一張牌</button>
      <button onclick="document.getElementById('gameMatchView').classList.add('hidden')" style="background:transparent; border:2px solid #e74c3c; color:#e74c3c; padding:10px 24px; border-radius:12px; font-weight:bold; cursor:pointer;">離開對局</button>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://game-server-mike.onrender.com";
    const socket = io(SERVER_URL);

    let currentUsername = "";
    let activeRoomId = null;

    // 1. 初始化讀取帳號
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('poker_player_name');
      if (savedName) {
        setPlayer(savedName);
      } else {
        openLoginModal(false);
      }
    });

    function openLoginModal(isEdit) {
      const modal = document.getElementById('loginModal');
      const title = document.getElementById('loginModalTitle');
      const input = document.getElementById('usernameInput');
      title.innerText = isEdit ? "修改角色暱稱" : "建立牌手角色";
      input.value = currentUsername || "";
      modal.classList.add('active');
    }

    function savePlayerName() {
      const input = document.getElementById('usernameInput');
      const name = input.value.trim();
      if (!name) {
        alert("暱稱不能為空！");
        return;
      }
      localStorage.setItem('poker_player_name', name);
      setPlayer(name);
      document.getElementById('loginModal').classList.remove('active');
    }

    function setPlayer(name) {
      currentUsername = name;
      document.getElementById('playerNameText').innerText = name;
      // 根據名字自動生成專屬可愛風格頭像
      const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}`;
      document.getElementById('playerAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyAvatar').style.backgroundImage = `url('${avatarUrl}')`;
      document.getElementById('battleMyName').innerText = name;
    }

    // 2. 配對邏輯（把玩家名字一起傳給伺服器）
    document.getElementById('matchBtn').addEventListener('click', () => {
      if (!currentUsername) {
        openLoginModal(false);
        return;
      }
      socket.emit('start_match', { playerName: currentUsername });
      document.getElementById('matchingModal').classList.add('active');
    });

    // 3. 接收伺服器開局
    socket.on('game_start', (data) => {
      activeRoomId = data.roomId;
      document.getElementById('matchingModal').classList.remove('active');
      document.getElementById('gameMatchView').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = `🏆 賭神賽 (${activeRoomId})`;

      // 找出對手的名字
      for (const id in data.players) {
        if (id !== socket.id) {
          const oppName = data.players[id].name || "神秘牌手";
          document.getElementById('battleOppName').innerText = oppName;
          document.getElementById('battleOppAvatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(oppName)}')`;
        }
      }

      renderBoard(data.players);
    });

    // 4. 抽牌
    document.getElementById('drawBtn').addEventListener('click', () => {
      socket.emit('draw_card', { roomId: activeRoomId });
    });

    socket.on('update_board', (data) => {
      renderBoard(data.players);
    });

    function renderBoard(players) {
      const myId = socket.id;
      const myCardsArea = document.getElementById('myCards');
      const oppCardsArea = document.getElementById('opponentCards');
      
      myCardsArea.innerHTML = '';
      oppCardsArea.innerHTML = '';

      for (const id in players) {
        if (id === myId) {
          players[id].cards.forEach(val => {
            const isRed = Math.random() > 0.5;
            const cardEl = document.createElement('div');
            cardEl.className = `poker-card ${isRed ? 'red' : ''}`;
            cardEl.innerHTML = `
              <div style="font-size:18px;">${val}</div>
              <div style="font-size:26px; align-self:center;">${isRed ? '♥️' : '♠️'}</div>
              <div style="font-size:18px; transform:rotate(180deg); align-self:flex-end;">${val}</div>
            `;
            myCardsArea.appendChild(cardEl);
          });
        } else {
          players[id].cards.forEach(() => {
            const cardBack = document.createElement('div');
            cardBack.className = 'poker-card back';
            cardBack.innerHTML = '👑';
            oppCardsArea.appendChild(cardBack);
          });
        }
      }
    }
  </script>
</body>
</html>
