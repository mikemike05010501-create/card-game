<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POKER ARENA</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Montserrat', sans-serif;
      /* 依序載入你上傳的圖檔，若本機沒有則加載你指定的照片備用 */
      background: #0b130e url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=2000&auto=format&fit=crop') no-repeat center center / cover;
      color: #fff; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
    }

    /* 頂部黑金 HUD */
    .hud {
      height: 56px; display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
      z-index: 10;
    }
    .profile {
      display: flex; align-items: center; gap: 8px;
      background: rgba(18, 12, 8, 0.85); padding: 4px 14px 4px 5px;
      border-radius: 25px; border: 1px solid #d4af37; cursor: pointer;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #d4af37;
      background: url('https://api.dicebear.com/7.x/adventurer/svg?seed=poker') no-repeat center/cover;
    }

    .currencies { display: flex; gap: 10px; }
    .curr-tag {
      background: rgba(18, 12, 8, 0.85); border: 1px solid #d4af37;
      padding: 3px 10px; border-radius: 14px; font-weight: 800; font-size: 13px; color: #f7dc6f;
    }

    /* 左側金屬快捷鍵 */
    .side-btns { position: absolute; left: 20px; top: 75px; display: flex; flex-direction: column; gap: 10px; z-index: 8; }
    .btn-gold-metal {
      width: 54px; height: 54px; border-radius: 12px;
      background: linear-gradient(180deg, rgba(35,25,18,0.9), rgba(15,10,7,0.95));
      border: 1px solid #d4af37; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .btn-gold-metal span { font-size: 20px; }
    .btn-gold-metal label { font-size: 9px; font-weight: 800; color: #f5d061; margin-top: 2px; }

    /* 中央印記 */
    .title-area {
      position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; z-index: 5;
    }
    .title-area h1 {
      font-family: 'Cinzel', serif; font-size: 36px; font-weight: 900; letter-spacing: 6px;
      background: linear-gradient(180deg, #fff2b2, #d4af37, #aa8214);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9));
    }

    /* 右下大對戰按鈕 */
    .battle-box { position: absolute; right: 20px; bottom: 20px; z-index: 8; }
    .play-btn {
      width: 190px; height: 65px;
      background: linear-gradient(135deg, #fff2b2 0%, #d4af37 40%, #8c6b12 100%);
      border: 2px solid #fff; border-radius: 14px; color: #1a1202; font-size: 24px; font-weight: 900;
      letter-spacing: 3px; font-family: 'Cinzel', serif; cursor: pointer;
      box-shadow: 0 6px 20px rgba(212,175,55,0.5), inset 0 2px 2px #fff;
    }
    .play-btn:active { transform: scale(0.95); }

    /* 通行證 */
    .pass-tag {
      position: absolute; left: 20px; bottom: 20px; z-index: 8;
      background: rgba(18, 12, 8, 0.9); border: 1px solid #d4af37; border-radius: 12px;
      padding: 8px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer;
    }

    /* 彈窗 */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex;
      justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    .box {
      background: #14100c; border: 2px solid #d4af37; border-radius: 16px; padding: 24px;
      text-align: center; width: 360px;
    }
    .box input {
      width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #d4af37;
      background: #000; color: #fff; text-align: center; border-radius: 8px; outline: none;
    }
    .box button {
      background: linear-gradient(135deg, #fff2b2, #d4af37); border: none;
      padding: 8px 24px; font-weight: 800; border-radius: 18px; cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="hud">
    <div class="profile" onclick="openLogin()">
      <div id="uAvatar" class="avatar"></div>
      <div id="uName" style="font-weight:700; font-size:13px;">VIP 牌手</div>
    </div>
    <div class="currencies">
      <div class="curr-tag">🪙 25,000</div>
      <div class="curr-tag">💚 1,000,000</div>
    </div>
  </div>

  <div class="side-btns">
    <div class="btn-gold-metal" onclick="alert('商店準備中')"><span>🛒</span><label>商店</label></div>
    <div class="btn-gold-metal" onclick="openLogin()"><span>🎴</span><label>改名</label></div>
  </div>

  <div class="title-area">
    <h1>POKER ARENA</h1>
    <p style="letter-spacing: 3px; font-size: 11px; color: #f5d061;">VIP CASINO SUITE</p>
  </div>

  <div class="pass-tag" onclick="alert('通行證領取中')">
    <span style="font-size:24px;">🎫</span>
    <div>
      <div style="font-size:11px; font-weight:800; color:#f5d061;">賭金通行證</div>
      <div style="font-size:9px; color:#aaa;">VIP 賽季進行中</div>
    </div>
  </div>

  <div class="battle-box">
    <button id="matchBtn" class="play-btn">對戰</button>
  </div>

  <div id="loginModal" class="modal">
    <div class="box">
      <h3 style="color:#f5d061; font-family:'Cinzel',serif;">牌手暱稱</h3>
      <input type="text" id="nameInput" placeholder="請輸入暱稱..." maxlength="12">
      <br>
      <button onclick="saveName()">進入牌局</button>
    </div>
  </div>

  <script>
    let uName = localStorage.getItem('poker_player_name') || "VIP 牌手";
    document.getElementById('uName').innerText = uName;

    function openLogin() {
      document.getElementById('loginModal').classList.add('active');
    }
    function saveName() {
      const val = document.getElementById('nameInput').value.trim();
      if (!val) return;
      localStorage.setItem('poker_player_name', val);
      document.getElementById('uName').innerText = val;
      document.getElementById('loginModal').classList.remove('active');
    }

    document.getElementById('matchBtn').addEventListener('click', () => {
      alert("配對系統已就緒！正在撮合 " + document.getElementById('uName').innerText + " 入座...");
    });
  </script>
</body>
</html>
